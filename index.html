<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pádel 4 Xuklis</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700;800&family=Barlow:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#c9d2dd;--sf:#fff;--tx:#0f2237;--mu:#5d7185;--bd:#dfe7ef;--btn:#0a2a5e;--btnx:#fff;--ball:#d7ef3a;--ok:#17855a;--wn:#b45f06;--er:#c0392b;--sh:0 1px 2px rgba(15,34,55,.06),0 8px 22px rgba(15,34,55,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,.score,.pts,.rk,.chip,nav button{font-family:"Barlow Semi Condensed",system-ui,sans-serif}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,#0b2a54 0%,#14509a 100%);padding:22px 18px 40px;border-radius:0 0 28px 28px}
.hero::before{content:"";position:absolute;inset:0;opacity:.14;background:linear-gradient(#fff,#fff) 50% 0/2px 100% no-repeat,linear-gradient(#fff,#fff) 0 62%/100% 2px no-repeat,linear-gradient(#fff,#fff) 14% 0/2px 100% no-repeat,linear-gradient(#fff,#fff) 86% 0/2px 100% no-repeat}
.hin{position:relative;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}

main{max-width:640px;margin:16px auto 0;padding:0 14px 96px;position:relative}
.sub{color:var(--mu);margin:0 0 14px;font-size:15px}

.card{background:var(--sf);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.stand{background:var(--sf);border-radius:18px;box-shadow:var(--sh);overflow:hidden}

.sets{text-align:center;color:var(--mu);font-size:14px;margin-top:10px}
.gl{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}

img.av{object-fit:cover;background:#fff}.tm .av{width:52px;height:52px;font-size:18px}

.ed .eh{display:flex;gap:8px;align-items:center;margin-bottom:10px}

.av.ej{font-size:22px;line-height:1}.tm .av.ej{font-size:28px}

.rb{grid-template-columns:minmax(72px,1.5fr) repeat(5,minmax(0,1fr));gap:4px 6px}

.ih{display:flex;align-items:center;gap:8px;font-weight:700}

.hint{margin:8px 0;padding:10px 12px;background:var(--bg);border-left:3px solid var(--ball);border-radius:8px;font-size:14px;line-height:1.4;color:var(--tx);font-weight:400}
.cg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.cs{min-width:0;width:100%;padding:10px 2px;text-align:center;text-align-last:center}
nav button{min-width:0;padding-left:0;padding-right:0}
nav button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){nav button{font-size:11px}nav button i{font-size:18px}.hero{padding:18px 14px 36px}h1{font-size:26px}}
.vs{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.score{white-space:nowrap;font-size:30px;padding:4px 10px}
.tm{min-width:0}.tm b{overflow-wrap:anywhere}
.tm .lt{white-space:nowrap}
.rt>.rn{overflow-wrap:anywhere;min-width:0;font-size:13px}
.rb{grid-template-columns:minmax(78px,1.7fr) repeat(5,minmax(0,1fr))}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg .btn{flex:1 0 auto;white-space:nowrap;padding:9px 12px}
.fr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}.fr:last-child{border:0}.fr b{white-space:nowrap}
.fr.pos b,.fb.pos{color:var(--ok)}.fr.neg b,.fb.neg{color:var(--er)}
.fb{font:800 34px "Barlow Semi Condensed",sans-serif;margin:6px 0 2px}
.pg{display:grid;gap:8px;margin-top:10px}
.ver{margin:6px 0 0;font-size:12px;color:var(--mu)}
.srow{cursor:pointer}.chev{color:var(--mu);font-size:24px;line-height:1;margin-left:2px}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}

.mt{background:var(--sf);border-radius:16px;padding:12px;box-shadow:var(--sh);min-width:0}

.fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--btn);color:var(--btnx);font-size:25px;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6;cursor:pointer}

.ch-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(160deg,#0b2a54,#14509a);color:#fff;font-size:17px}

}

var DOC_TEC="# Pádel 4 Xuklis — Resumen técnico\n\n> Documento de referencia para seguir evolucionando la aplicación. Se actualiza en cada publicación junto con el backlog funcional.\n\n- **Versión de la aplicación:** 10/11/2026 20:49\n- **Artefacto publicado:** https://claude.ai/artifact/KSkahcL1MQWJDpduoh8Ddk\n- **Idioma de la interfaz y de la memoria del proyecto:** español\n\n## 1. Qué es\n\nAplicación web de una sola página para gestionar ligas solidarias de pádel (varias ligas, equipos de 3 o 4 jugadores, un partido jornadal por equipo, playoffs, finanzas y disponibilidad). Pensada para móvil y escritorio, con administrador, capitanes y jugadores. La organización es AFANOC (el logo de la cabecera enlaza a https://afanoc.org).\n\n## 2. Arquitectura\n\n- **Un único archivo `index.html`** autocontenido (HTML + CSS + JavaScript sin frameworks, estilo ES5: `var`, `function`, sin módulos). Publicado como artefacto de Claude (página alojada en claude.ai).\n- **Servicios de la plataforma** (objeto global `claude.use(...)`): `db` (base de datos de documentos tipo colección/documento con `doc(ruta)`, `collection(nombre)`, `onSnapshot`, `set`, `update`, `delete`), `user` (`id()`, `isOwner()`) y `downloads` (`save({filename,data})`).\n- **Sin red salvo lo permitido por la política de contenido:** scripts solo de `cdnjs.cloudflare.com` (se carga SheetJS 0.18.5 bajo demanda para importar Excel); no hay imágenes remotas; los iconos son emoji.\n- **Sin almacenamiento en servidor propio:** la base de datos es compartida por todos los visitantes de la página. La seguridad por roles está en el cliente (ver 11).\n- **Estado:** objeto global `S` (pantalla, filtros, borrador de configuración, mensajes) y variables globales de datos cargados (`CFG`, `S.m`, `AV`, `MEMBERS`, `PAY`, `PRICES`, `LOGOS`, `PLAY`, `WEEKS`, `WREST`, `CONTACTS`).\n- **Render:** `render()` → `render0()` reconstruye `#view` entero (`innerHTML`) en cada cambio. Los campos con id que empieza por `g` conservan su valor al repintar (marcadores, formularios).\n- **Tema:** variables CSS en `:root`, oscuro con `prefers-color-scheme` y con `data-theme=\"light|dark\"` (botón `#thm`, clave `p4x_theme` en localStorage).\n\n## 3. Modelo de datos (colecciones)\n\nTodas las colecciones menos `members` y `leagues` llevan **prefijo de liga**: la liga `main` (la original, «Liga principal») no lleva prefijo; las demás usan `<idLiga>_` (por ejemplo `lmw96ltpf_matches`). La función `pf(ruta)` lo aplica; `db` es un envoltorio (`makeDb`) sobre el objeto real `DBR`.\n\n| Ruta | Contenido |\n|---|---|\n| `leagues/index` | Registro global: `{list:[{id,name,archived?,archivedAt?}]}` |\n| `members/<uid>` | Vínculo global cuenta → jugador: `{k: clave normalizada del nombre, pend?: true}`; `pend` = capitán pendiente de aprobación (`ME()` lo ignora) |\n| `tourn/cur` | Torneo de un día (`TN`): `{fmt:\"ame\"|\"eli\", name, ents[], res{}, win{}, rounds[]}`; entra en la copia de seguridad |\n| `config/comp` | Perfil de competición: `{kind:\"sol|lucro\", sport, org, cause}` (`COMP`, `compKind()`, `profL()`) |\n| `config/league` | `{teams:[{id,name,players:[nombres],cap}], courts:{L,M,X,J,V}, start:\"AAAA-MM-DD\", weeks, alg:\"clas|mix|niv\", lv:{clave:{l,x}}}` |\n| `contacts/league` | `{emails:[{n,e}], nw:[claves de jugadores nuevos]}` (correos y descuento de nuevos) |\n| `finance/prices` | `{court,po,f3,f4,disc}` (pista liga 60 min, pista semifinales/final 90 min, cuota 3 jugadores, cuota 4 o más, % descuento a nuevos) |\n| `matches/m<id>` | `{id,w,day:\"L|M|X|J|V\",h,a,st:\"pend|prop|ok\",g:[\"6-3\",\"1-6\",\"6-4\"],by,hp,ap,r,why:{...}}` |\n| `weeks/w<n>` | `{rest:[equipos que descansan], why:{equipo:motivo}}` |\n| `avail/<uid|p_hex>` | `{k,def:\"LMX\",w<n>:\"LM\"}` disponibilidad habitual y por jornada (clave por cuenta o por nombre en hexadecimal) |\n| `payments/<t_equipo_hex>` | Pagos de cuotas por equipo y jugador (solo administrador) |\n| `teams/<id>` | `{logo}` logo del equipo (emoji o imagen en datos) |\n| `playoff/league` | Asignación de playoffs `{seeds:[...], ...}` |\n\nClaves: `kk(nombre)` = nombre en minúsculas y sin espacios extremos; `hx(k)` = hexadecimal; el jugador `p` es el identificador `idEquipo+índice` (por ejemplo `a2`) y `PK[p]` su clave.\n\n## 4. Roles y permisos (en cliente)\n\n- **Administrador:** propietario del artefacto (`isOwner()`); variable `admin`. Edita todo.\n- **Capitán / jugador:** la cuenta se vincula la primera vez eligiendo el nombre de su jugador (`members/<uid>`); `ME()`, `myTeams()`, `who()` devuelven `admin | m | none`. El capitán propone y valida resultados de su equipo, elige parejas y logo. El jugador edita solo su disponibilidad.\n- **Sin identificar (`none`):** solo lectura.\n\n## 5. Navegación e interfaz\n\n- **Menú principal:** `Inicio (i)`, `Clasificación (t)`, `Calendario (j)`, `Equipos (d)`, `Jugadores (u)`. Pantallas internas del administrador dentro de Inicio: `Finanzas (f)` y `Liga (c)` (con `S.cs`). `setTab(t)`, `setAdm(k)`, `goDash(k)` navegan.\n- **Subopciones:** `segHtml(etiqueta, items, actual, funcion)` genera la barra deslizable. Clasificación: Liga, Playoffs. Calendario: Por jornada, Por meses, Pistas, Enfrentamientos, Mis partidos (`S.cal`: false, true, \"c\", \"h\", \"m\"). Inicio (administrador): Resumen, Finanzas, Liga.\n- **Filtros:** `fbar()` se inserta justo debajo de la barra de subopciones (en `render0`): equipo (`S.ft`), jugador (`S.fp`), nivel (`S.fl`) y jornada (`S.fw`). `fT`, `fm`, `fw`, `fLv` aplican el filtro. Clasificación no lleva filtros.\n- **Inicio:** `viewI` con tarjetas navegables (`MG(...)`), «Revisión de la liga» (`issues()`/`issuesCard()`, administrador) y progreso.\n- **Equipos:** lista de equipos (`viewEquipos`) y ficha (`teamDetail`) con composición de jugadores; el administrador configura equipos (`eqCfg`, `teamEdT`).\n- **Jugadores:** una vista (`viewJug`) con tarjetas por equipo (`availTeam`) donde se marca la disponibilidad; ficha de jugador (`viewPl`) con Disponibilidad y «Configurar jugador» (`playerEd`). Los días habituales se marcan solo en Disponibilidad.\n- **Calendario:** `viewJ` (por jornada, con tira jornadal `weekStrip`), `calMonths`, `pistasView`, `viewH` (enfrentamientos), `calList`.\n- **Gestos:** deslizar horizontalmente cambia de opción (IIFE de `touchstart/touchend`, se ignora sobre campos, barras con scroll y el chat).\n- **Selector de liga:** botón `#lgb` en la cabecera, tarjeta `lgCard()`.\n- **Documentación:** Inicio > Liga > Documentación (`docCard`), con visor sencillo de Markdown.\n\n## 6. Reglas de negocio\n\n- **Partido:** liga a 60 minutos al mejor de 3 sets; semifinales y final a 90 minutos. Un set válido acaba 6-0 a 6-4, 7-5 o 7-6; el súper tie-break se valida aparte. **Un partido puede quedar 0-0 en sets (empate sin jugar); un set 0-0 no es válido.**\n- **Puntos:** victoria 3, empate 1, derrota 0. Clasificación (`standings`): puntos, diferencia de sets, diferencia de juegos.\n- **Estados:** `pend` (sin resultado), `prop` (resultado propuesto por un capitán), `ok` (validado). El capitán rival valida o disputa; el administrador valida directamente.\n- **Jornada:** un partido por equipo y jornada, de lunes a viernes. Cada día tiene un número de pistas (0 a 10, por defecto 4) y un partido ocupa una pista. Un día es válido para un partido si ambos equipos tienen al menos 2 jugadores disponibles y queda pista libre.\n- **Cuotas:** `fee(t)`= cuota de 3 o de 4 jugadores; nuevos jugadores con descuento `disc` %. Finanzas en `fin()`.\n- **Importes:** se muestran sin decimales y con punto de miles (`fmtN`, `eur`).\n- **Nivel:** por jugador de 0 a 5 en tramos de 0,5 (por defecto 1,5) y experiencia en partidos (por defecto 1), guardados en `config/league.lv`. **Nivel de equipo** = media del nivel ponderada por `1 + ln(1 + partidos)` (`teamLvl`). Iconos: Padawan hasta 1,5; Jedi de 2 a 3; Yoda de 3,5 a 5 (`tierOf`, emoji genéricos).\n- **Versión:** constante `APPVER` (\"dd/mm/aaaa hh:mm\", hora de Europe/Madrid); se actualiza en cada publicación.\n\n## 7. Algoritmo de emparejamiento (`gen(w, fut)`)\n\nEntradas: clasificación (`standings`), nivel de equipo, disponibilidad (`avD`, `cnt`), pistas por día, partidos ya planificados. Tres variantes (`CFG.alg`):\n\n1. **`clas` (clasificación, la original):** los equipos se recorren por orden de clasificación; quien ganó la jornada anterior busca rival por encima, el resto por debajo (el primero, por debajo). Preferencia de rival: a 4 puestos o menos y sin repetir → a 4 o menos repitiendo → más lejos y sin repetir → más lejos repitiendo.\n2. **`mix` (clasificación y nivel):** igual, pero los equipos se ordenan con `algOrder`: puntuación = α·clasificación normalizada + (1−α)·nivel normalizado, con α = j/(j+3) y j = jornadas con resultados validados anteriores (al principio solo nivel).\n3. **`niv` (solo nivel):** ignora resultados; cada equipo elige el rival libre de nivel más parecido (se prefiere diferencia ≤ 1 punto).\n\nComún: día = primero de lunes a viernes con ≥2 jugadores disponibles por equipo y pista libre; local = el mejor situado en el orden; si alguien se queda sin rival, se **reorganiza** y, en último caso, **asignación forzada** (día con pista libre y más jugadores disponibles). Cada partido guarda `why` (regla, distancia o diferencia de nivel, descartados, excepciones). `fut=true` limita a días futuros (se usa al completar/replanificar).\n\nFlujo de planificación:\n- `planCheck(w)`: una jornada solo se planifica si la anterior tiene calendario.\n- `genWeek` (jornada vacía), `doRegen`/`regenCard` (sustituye partidos futuros sin resultado y completa equipos sin partido: «Completar la jornada»), `weekGaps(w)` (equipos sin partido), `canReplace(m)` (futuro, sin resultado).\n- `planAll()` («Planificar todas las jornadas pendientes», con confirmación) y `replanFrom(w)`/`regenQuiet(w)`.\n- **Replanificación automática (`watchAv`, solo administrador):** al planificar o completar una jornada se vuelven a emparejar las posteriores con partidos sin resultado; un cambio de disponibilidad habitual replanifica todas las jornadas futuras; un cambio de disponibilidad de una jornada muestra una tarjeta que pregunta si replanificar (línea base en localStorage `p4x_av[_liga]`).\n- **Importante:** `gen` añade los partidos nuevos a `S.m` en memoria (`S.m=S.m.concat(nm)` y `S.idF`); sin eso los bucles de varias jornadas repetían ids y pisaban partidos.\n\n## 8. Configuración e importación\n\n- **Borrador:** `openDraft()` crea `S.dr` desde `CFG` (equipos con jugadores `{n,e,c,d,d0,nw,l,x}`, pistas, fecha de inicio, jornadas, algoritmo); `check()` valida; `saveDraft()` escribe `config/league`, `contacts/league` y la disponibilidad habitual **solo si cambió respecto al borrador original (`d0`)**; `savePx()` guarda precios.\n- **Excel:** plantilla con hojas «Liga» (parámetros) y «Equipos y jugadores» (equipo, jugador, correo, capitán, nuevo, días, nivel, partidos). `impParse` → `impBuild` (vista previa y errores) → `impApply`. Lectura con SheetJS bajo demanda; escritura con el generador propio `xlsx(hojas)`.\n- **PDF:** `pdfBytes` genera PDFs sin librerías (usado para el backlog).\n- **Revisión de la liga:** `issues()` comprueba fecha, equipos, jugadores, capitanes, pistas, precios, jornadas incompletas, sobreocupación, conflictos de disponibilidad, partidos pasados sin resultado, etc.\n\n## 9. Varias ligas\n\n- `LID` (liga activa, localStorage `p4x_league`), `LP` (prefijo), `LEAGUES` (registro). `switchLeague(id)` incrementa `LTOK`, cancela las suscripciones anteriores (`UNS`), reinicia el estado (`resetLeague`) y vuelve a suscribirse (`subscribeLeague`). Los eventos de suscripciones antiguas se descartan por `LTOK`.\n- Administrador: crear (con o sin copia de equipos, jugadores y precios), renombrar, **archivar/reactivar** (`lgArch`) y **clonar** (`lgCloneRun`, con o sin calendario, resultados, disponibilidad y pagos). Las ligas archivadas salen en una lista aparte y muestran un aviso; no son de solo lectura todavía. No hay borrado.\n- Las cuentas vinculadas (`members`) son comunes a todas las ligas.\n\n## 10. Convenciones de trabajo\n\n- **Código y publicación:** se edita el archivo `index.html` del artefacto y se publica con `Artifact publish` indicando la URL del artefacto existente (o con `action:\"edit\"`). Antes de publicar se comprueba la sintaxis del script con `node --check` y se prueban las funciones con datos de ejemplo.\n- **Versión:** actualizar `APPVER` con la hora de Europe/Madrid en cada publicación.\n- **Documentación:** actualizar este resumen y el backlog (MD), regenerar los datos de `BL` (backlog PDF/Excel) y los textos embebidos `DOC_TEC` y `DOC_BL`, y publicarlos dentro de la aplicación.\n- **Memoria del proyecto:** anotar cada petición hecha en `liga-padel-app.md` (en español).\n- **Textos y estilo:** interfaz en español; mensajes breves; no usar `<form>`; importes sin decimales.\n- **Propiedad intelectual:** no usar imágenes de personajes con derechos; los iconos Padawan/Jedi/Yoda son emoji genéricos.\n\n## 11. Limitaciones y deuda técnica\n\n- **Seguridad en cliente:** los permisos se aplican en la interfaz; la base de datos no los impone. El vínculo jugador-cuenta es por elección de nombre; los capitanes requieren aprobación (US-022) y el administrador gestiona vínculos (US-021), pero la base de datos sigue sin imponer permisos.\n- **Un solo archivo grande:** `index.html` supera los 240 KB; sería conveniente modularizar si crece.\n- **Datos de nivel visibles:** el nivel y la experiencia los ve cualquier usuario (US-069).\n- **Ligas archivadas:** solo con aviso, sin solo lectura (US-066); sin borrado (US-067).\n- **Niveles y planificación:** cambiar niveles no replanifica jornadas ya planificadas (US-065).\n- **Exportaciones Excel:** conservan decimales y no llevan formato numérico (US-068).\n- **Aleatorio de niveles:** código presente pero oculto (`SHOW_RND=false`).\n\n## 12. Siguientes pasos recomendados\n\nVer el backlog funcional: prioridad alta en emparejar la jornada completa por optimización (US-062, aplazada) y formatos de competición (US-071).\n\n## 13. Fase 3 (10/11/2026): gestor de competiciones\n\n- **Perfil de competición** (`config/comp`, `compCard`): tipo solidaria o con ánimo de lucro, deporte, entidad y causa. Solo cambia las etiquetas de finanzas (`profL()`); el resto del modelo sigue siendo una liga de pádel. Para llegar a un gestor general faltan US-071 (formatos) y US-072 (reglas por deporte).\n- **Vínculos** (`linksCard`, `lkList/lkOk/lkDel/lkSet`): lista de cuentas con aprobar, desvincular y reasignar. `join()` marca `pend:true` si el jugador es capitán de algún equipo y quien entra no es administrador; `viewJoin` muestra «Pendiente de aprobación».\n- **Copia de seguridad** (`bkCard`, `bkDo/bkFile/bkRestore`): JSON `{app:\"p4x\",v:1,liga,fecha,cols}` con las colecciones de `BKC` (incluye `members`). Lee con `onSnapshot` de un solo uso. Restaurar escribe con `set` en la liga activa, sin borrar documentos ausentes.\n- **Pantalla:** estas tres tarjetas están en Inicio > Liga, solo administrador.\n- **Pendiente de la fase:** US-062 (optimización de la jornada completa), por tamaño.\n\n## 14. Liga archivada en solo lectura (US-066)\n\n- `makeDb` pasa a `wrapRef` un indicador por ruta; si la liga activa está archivada (`lgArchived()`), `set`, `update`, `delete` y `add` devuelven una promesa rechazada («Liga archivada: solo lectura»).\n- Excepciones: `members/*` (vínculos) y `leagues/*` (archivar o reactivar), que no pasan por el indicador.\n- Limitación: es una protección de la interfaz; la base de datos sigue sin permisos propios (US-028). Restaurar una copia en una liga archivada falla por este motivo.\n- **Reactivar (US-075):** `lgArch(id,0)` se llama desde `archBanner` y desde cada fila archivada de `lgCard`. Escribe en `leagues/index` con `DBR` directo, por eso no lo bloquea el solo lectura de US-066.\n\n## 15. Optimización de la jornada (US-062, parcial)\n\n- En `gen(w,fut)`, justo antes de guardar `nm`, un bloque autoejecutable aplica búsqueda local por intercambio: para cada par de partidos nuevos prueba las dos recombinaciones y la acepta si baja el coste y hay día común con pista libre (`free`, con `load` ajustado).\n- Coste de una pareja: distancia de puestos (o `2×` la diferencia de nivel en `niv`; ambas en `mix`), `+100` si ya se enfrentaron (`met`) y `+3` por cada equipo que incumple «gana sube, pierde baja» (`lastWon`).\n- Los partidos cambiados guardan `why.r = «Reoptimizado…»`. Máximo 30 rondas. Los equipos sin partido (`wr`) no cambian.\n- Limitación: no es óptimo global ni usa la disponibilidad como coste. No se ha probado con datos reales de la liga.\n\n## 16. Informe de recaudación (US-073)\n\n- `repDl()` (admin, botón en `compCard`) genera un `.md` con `fin()` y `COMP`: jugadores, cuotas esperadas, cobradas y pendientes, coste de pistas (`col − profitNow`) y beneficio actual y previsto, con entidad y causa si la competición es solidaria. Se descarga con `claude.use(\"downloads\")` como la documentación.\n- Limitación: una sola causa por liga; sin desglose por causa.\n\n## 17. Torneo de un día: americano y eliminatorio (US-071, parcial)\n\n- **Datos:** `tourn/cur` (un torneo por liga). `tnNew`, `tnRes`, `tnWin`, `tnDel`; tarjeta `tnCard` en Inicio > Liga > Torneo (solo administrador, con borrado en dos pasos).\n- **Americano** (`ameRounds`, `ameTable`): hasta 24 jugadores y `min(n−1, 7)` rondas. Cada ronda reparte a los que menos han jugado y descansan los sobrantes si `n` no es múltiplo de 4. Las parejas se eligen por búsqueda aleatoria con semilla fija (400 intentos) minimizando parejas repetidas (×10) y rivales repetidos (×3). Resultado por partido `res[\"r<ronda>m<partido>\"] = [puntosA, puntosB]`; cada jugador suma los puntos de su pareja. Clasificación: puntos, diferencia, partidos ganados.\n- **Eliminatorio** (`seedOrder`, `elimRounds`): 2 a 32 equipos; cabezas de serie por orden de la lista, huecos como byes para los mejores. El ganador de cada partido se marca en `win[\"e<ronda>m<partido>\"]` (0 o 1); cambiar un ganador borra los de rondas posteriores.\n- **Pruebas:** algoritmos probados con un script de Node (4 a 13 jugadores sin parejas repetidas; cuadros de 2 a 11 equipos con campeón). La interfaz no se ha probado en el navegador.\n- **Limitaciones:** no usa el nivel ni los jugadores de los equipos (US-078); sin consolación (US-077).\n\n## 18. Torneo visible para todos y borrado de ligas (US-076, US-067)\n\n- **US-076:** `tnCard()` ya no exige administrador: sin `admin` no muestra el formulario de creación, ni el borrado, y los marcadores y botones de ganador salen deshabilitados. `viewI()` la añade al final de Inicio para quien no es administrador y hay torneo (`TN`); el administrador la ve en Inicio > Liga > Torneo.\n- **US-067:** `lgDelAsk/lgDelRun`. Solo con la liga activa archivada y distinta de `main`. Exige escribir el nombre exacto. Lee con `bkSnap` las colecciones de `BKC` (menos `members`) y borra cada documento con `DBR` directo (el solo lectura de US-066 bloquearía `db`), quita la liga de `leagues/index` y cambia a otra liga. Si existieran colecciones fuera de `BKC`, no se borrarían. Los vínculos de cuentas no se tocan (son globales).\n- **Sin probar en el navegador;** hay que probar el borrado con una liga de prueba y descargar antes una copia de seguridad.\n\n## 19. Americano por nivel y aviso de niveles (US-078, US-065)\n\n- **US-078:** `ameRounds(n,R,lv)` recibe los niveles. `tnNew` empareja cada nombre con los jugadores de la liga por `kk(nombre)`; los no encontrados usan `LV0`. Si no se encuentra ninguno, no se usa el nivel. Coste añadido por partido: `5 × |nivel(pareja A) − nivel(pareja B)|`. Se guardan `lv` y `lvm` en `tourn/cur`; los niveles quedan congelados al crear el torneo.\n- **US-065:** `lvWarn(d)` (en `viewCfg`, vista Equipos) compara el nivel del borrador con `lvOf` y, si hay partidos planificados, avisa de cuántos jugadores cambian y de cuántas jornadas ya están planificadas. Es solo un aviso; no bloquea el guardado.\n- Prueba con 12 jugadores de niveles 0 a 5: la diferencia media de nivel entre las dos parejas baja de 2,55 a 0,60. La interfaz no se ha probado en el navegador.\n\n## 20. Puntuación Elo y fiabilidad (US-063, parcial)\n\n- `eloAll()` recorre los partidos validados (`st===\"ok\"`) por jornada e id y calcula el Elo de cada equipo. Semilla: `1000 + (nivel del equipo − LV0) × 100` (`teamLvl`). Resultado: 1 si gana por sets, 0,5 si empatan (`sets(m)`). Esperado: `1/(1+10^((Ra−Rh)/400))`.\n- **Fiabilidad** por equipo: `(exp + partidos) / (exp + partidos + 10)`, con `exp` = experiencia media por jugador. Factor K: `20 + 20 × (1 − fiabilidad)`, así que los equipos con poca experiencia se mueven más. Etiqueta: alta ≥ 0,6, media ≥ 0,35, baja en otro caso.\n- `eloTxt(t)` lo muestra en la ficha del equipo (`lvLine` de `teamDetail`). No se guarda en la base de datos: se recalcula al dibujar.\n- Prueba con equipos simulados: un equipo débil que gana al fuerte sube 29 puntos y el fuerte que gana al débil sube 9. La interfaz no se ha probado en el navegador.\n- Pendiente: usarlo como algoritmo de emparejamiento (US-079).\n\n## 21. Jornadas 1 y 2 por nivel (US-080)\n\n- En `gen(w,fut)`: `alg = w<=2 ? \"niv\" : (CFG.alg || \"clas\")`. Afecta al orden (`algOrder`), a la preferencia de rivales, al coste de la optimización de US-062 y a las explicaciones, que añaden «Jornada N: se planifica siempre por nivel…».\n- No cambia partidos ya planificados: solo las jornadas que se generen o regeneren después.\n- Decisión del usuario; la liga actual tiene 16 equipos y usa el algoritmo por clasificación.\n\n## 22. Reparto de rivales (US-081)\n\n- `metN(a,b,w)` cuenta los enfrentamientos de la pareja en jornadas anteriores (`met` solo decía si había alguno).\n- En `gen`, la lista de rivales candidatos `pref` se ordena por `metN × 2 + (0 si es cercano, 1 si no)`, con el orden natural como desempate. Antes se agrupaba solo por «cercano» y «ya se enfrentaron». Ahora un rival nuevo y lejano (1) se prefiere a uno cercano ya enfrentado una vez (2), y entre repetidos se elige el que menos veces se ha enfrentado.\n- En la optimización de US-062, cada enfrentamiento previo suma 100 al coste.\n- En las explicaciones, los rivales descartados que no tenían otro motivo indican «se prefirió otro rival con menos enfrentamientos previos».\n- Efecto esperado: más variedad de rivales a costa de partidos algo más desiguales en la clasificación. Sin probar con los datos reales (16 equipos, algoritmo por clasificación); conviene regenerar una jornada futura y revisar las explicaciones.\n\n## 23. Jornadas configurables, métodos de pago y control de cobros (US-082 a US-085)\n\n- **Terminología:** todo el texto visible habla de «jornada». No se renombraron las claves técnicas: parámetros del asistente (`semana`, `ambito: \"semana\"`) y la lectura del archivo de importación, que acepta «Número de semanas» y «Número de jornadas».\n- **Jornada configurable (US-082):** `config/comp` guarda `jt` (`week` o `days`) y `jd` (días `L M X J V`); en la interfaz «días fijos de cada semana». `cap(d)` devuelve 0 para los días no incluidos, así que `free()`, el calendario y los avisos de pistas los ignoran. Las jornadas ya planificadas no cambian. La jornada sigue siendo la número N con su rango de fechas lunes-viernes; las fechas sueltas están en US-083.\n- **Métodos de pago (US-084):** `COMP.methods = [{n, u}]`, hasta 6; `u` solo se acepta si empieza por `https://`. Se editan en `pmCfg` (administrador) y se muestran en `pmCard` (todos, en Inicio) con un enlace `target=_blank` y `rel=noopener noreferrer`. La app no cobra ni comprueba pagos.\n- **Control de pagos (US-085):** cada documento de `payments/` pasa a `{t, k, at, a?, m?}`: fecha de pago, importe cobrado y método. Al marcar un pago se guarda `a` = cuota del jugador (con descuento) y `at` = hoy; `pdSet` edita fecha, importe y método (botón «Detalles» en Finanzas). `fin()` suma `a` cuando existe, si no la cuota esperada. Los pagos antiguos, sin `a`, siguen valiendo la cuota. Sí es viable llevar este control porque `payments/` ya guardaba quién pagó y cuándo; los pagos parciales en varios plazos no (US-086).\n- Sin probar en el navegador.\n\n## 24. Jornadas con fechas concretas en los torneos (US-083)\n\n- Aclaración del usuario: «días concretos» son fechas definidas de un torneo (por ejemplo un sábado y un domingo como única jornada de un americano), no días de la semana. Lo de §23 queda para ligas con días fijos.\n- **Datos** en `tourn/cur`: `jr` = lista de jornadas, cada una con sus fechas `AAAA-MM-DD` ordenadas (hasta 8 jornadas y 10 fechas); `rj` = `{índice de ronda: índice de jornada}`. Si solo hay una jornada, las rondas sin asignar cuentan en ella (`rjVal`).\n- **Funciones:** `tnJorSet(op,a,b)` con `addj`, `delj` (reajusta `rj`), `addd`, `deld` y `rnd`; `tnJorPanel` (panel de jornadas), `rjSel` (selector por ronda para el administrador, texto para los demás) y `jorTxt`. Las fechas se muestran con `fmtIso`.\n- Los torneos ya creados no tienen `jr`: no muestran nada hasta que el administrador añada una jornada.\n- Probado el modelo de datos con un script (añadir y quitar jornadas y fechas, duplicados, formato inválido). La interfaz no se ha probado en el navegador.\n- Pendiente: aplicarlo a la liga regular (US-087).\n\n## 25. Grupos en la liga regular (US-088)\n\n- **Datos** en `config/comp`: `groups` (1, 2 o 4; por defecto 1) y `gmap` (`{idEquipo: n.º de grupo}`). `gof(t)` devuelve el grupo del equipo (1 si falta o no es válido). Se configura en `grCard` (Inicio > Liga > Grupos de la liga); `grSet` reparte los equipos por turnos y `grTeam` mueve uno. Avisa si un grupo tiene pocos equipos o un número impar.\n- **Emparejamientos (`gen`):** `pos(t)` pasa a ser el puesto dentro del grupo. Los rivales candidatos (`nat`) se limitan al grupo; el paso de reorganización y la asignación forzada también exigen el mismo grupo, y la optimización de US-062 suma 1e6 al coste de un cruce entre grupos. Un grupo impar deja un equipo descansando cada jornada. Las jornadas ya planificadas no cambian.\n- **Clasificación:** `viewT` muestra una tabla por grupo (`srowH(x,i,Q)` marca los `Q = 4/grupos` primeros de cada grupo).\n- **Playoffs:** `top4()` coge los `4/grupos` mejores de cada grupo y los ordena por rango y después por puntos, diferencia de sets y de juegos; las semifinales siguen siendo 1.º-4.º y 2.º-3.º. Con 2 grupos: A1-B2 y B1-A2 si A1 y B1 son los dos mejores primeros. `leagueState` exige `groupNeed()` partidos en la última jornada (suma de `floor(equipos/2)` por grupo).\n- **Límites:** solo 1, 2 o 4 grupos porque el cuadro es de 4 equipos (US-089). Los equipos nuevos sin grupo asignado caen en el grupo 1. La clasificación general por grupos no se refleja aún en las exportaciones ni en el asistente.\n- Probada la selección de clasificados con un script (1, 2 y 4 grupos). La planificación y la interfaz no se han probado en el navegador.\n\n## 26. Métodos de pago completados (US-090, US-086 parcial)\n\n- `COMP.methods` pasa a `[{n, u, i}]`: `i` son las instrucciones (hasta 200 caracteres: teléfono, cuenta o concepto). `pmCard` las muestra a todos los jugadores; `pmCfg` las edita.\n- `pmDef()`: al marcar un pago (`tpay`, `payAll`) se asigna el método solo si hay exactamente uno configurado; con varios, se elige en «Detalles».\n- `payAmt(p)` da el importe de un pago (`a`, o la cuota si es un pago antiguo) y `payByM()` los agrupa por método (los pagos sin método van a «Sin método indicado»). Se muestra en `pmCfg` y en el informe de US-073 (`payMTxt`).\n- **Pagos parciales:** si `a` es menor que la cuota (`feeP`), la fila muestra «faltan X €» y `fin()` ya cuenta solo lo cobrado.\n- **No incluido:** varios plazos con fecha, devoluciones y conciliación con la plataforma (US-086); aviso de pago desde el jugador (US-091), que necesita permisos de escritura para jugadores (US-028). Las reglas de acceso a `payments/` siguen siendo solo del administrador.\n- Probada la agregación por método con un script. La interfaz no se ha probado en el navegador.\n\n## 27. Torneos rellenables con la liga (US-071, parcial)\n\n- `tnFill()` rellena la lista del formulario de torneo (`g_te`) según el formato elegido: en americano, los jugadores de todos los equipos sin repetir (`kk`), de modo que los nombres coinciden con la liga y el reparto por nivel de US-078 se activa; en eliminatorio, los equipos en el orden de `standings()`, es decir, cabezas de serie por clasificación (con grupos, la clasificación general mezcla grupos).\n- Avisa si hay más de 24 jugadores (americano) o 32 equipos (eliminatorio); la lista se puede editar a mano antes de crear el torneo.\n- Pendiente: que los resultados del torneo alimenten la clasificación o el nivel de la liga, y semillas por grupo.\n- Sin probar en el navegador.\n\n## 28. Algoritmo Elo y disponibilidad en la optimización (US-079, US-062)\n\n- **Cuarto algoritmo `elo`** (`CFG.alg`): en `gen`, si la jornada es mayor que 2 y la liga usa `elo`, el algoritmo efectivo es `niv` pero con `LV[t] = LV0 + (Elo − 1000) / 100`, calculado con `eloAll()` (§20). Así cambian el orden (`algOrder`), la cercanía de rivales y el coste de la optimización sin tocar el resto. Las jornadas 1 y 2 siguen forzadas a `niv` (§21). Las explicaciones indican «Algoritmo Elo…».\n- Interfaz y datos: `algCard` (opción «Elo»), `algName`, `algText`, y la importación acepta «Elo» en «Algoritmo de emparejamiento».\n- **Optimización (US-062):** el coste `cs` suma `2 × max(0, 3 − días en común)` para preferir parejas con más días en común, además de distancia, repetición (`metN`), regla «gana sube» y grupos. Sigue siendo una búsqueda local por intercambio de pares, no un óptimo global exacto.\n- Sin probar en el navegador con datos reales; el algoritmo `elo` depende de que haya resultados validados (sin ellos, el Elo parte del nivel y se comporta como `niv`).\n\n## 29. Historial de torneos (US-071, cerrada)\n\n- `tourn/cur` sigue siendo el torneo en curso (uno a la vez). Se añade una suscripción a toda la colección `tourn` (`TNH`): los documentos con id distinto de `cur` son torneos archivados (`h_<marca de tiempo>`).\n- `tnSum(o)` decide si el torneo ha terminado y da el texto del resultado: en eliminatorio, el campeón (`elimRounds`); en americano, el primero de `ameTable` cuando todos los partidos tienen resultado. `tnArch()` (administrador) copia el torneo a `tourn/h_…` con `cham` (resultado) y `at` (fecha) y borra `tourn/cur`; si no ha terminado, avisa de qué falta.\n- `tnHist()` muestra «Torneos anteriores» a todos en Inicio y al administrador en Inicio > Liga > Torneo. Los archivados entran en la copia de seguridad porque `tourn` está en `BKC`; el borrado definitivo de una liga también los elimina.\n- Los archivados no se pueden reabrir ni editar. Sin probar en el navegador; el resumen del ganador se probó con un script.\n\n## 30. Fechas en el Dashboard (US-132)\n\n- `viewI()` añade debajo del resumen: inicio = `mon()` (lunes de la jornada 1, a partir de `CFG.start`) y fin = `mdate(NW(),\"V\")` (viernes de la última jornada). Si la fecha de inicio no es válida no se muestra nada.\n- Los playoffs no se incluyen en la fecha de fin.\n\n## 31. Aplazamientos de partidos (US-133)\n\n- Campo nuevo en `matches/m<id>`: `pz` = lista de `{de, a, m (motivo), f (fecha ISO)}`. Se conserva al clonar, copiar seguridad y restaurar porque viaja con el documento del partido.\n- `aplBox(m)` (solo administrador, dentro de `editBox`) y `aplaza(id)`: validan motivo obligatorio, partido sin resultado, nueva fecha futura, que ninguno de los dos equipos juegue ya esa jornada y que haya pista libre. Actualizan `w`, `day`, reinician `hp` y `ap` y reemplazan `why` con una explicación manual.\n- `aplHist(m)` muestra el historial a todos en la ficha del partido.\n- Limitación: solo el administrador; sin aviso automático a los jugadores; el hueco que deja en la jornada original aparece como equipo sin partido para completarlo con «Completar la jornada».\n\n## 32. Resumen de pistas para el club (US-134)\n\n- Datos en `config/comp.club` = `{n, t, e}` (nombre, teléfono, correo), guardados con `clubSave()`; el resto de `config/comp` se conserva.\n- `clubCard()` se añade al inicio de `pistasView()` (solo administrador). `clubText(periodo, liga)` cuenta los partidos no validados con fecha futura por día (1 partido = 1 pista de 60 minutos).\n- Enlaces: `wa.me/<teléfono>?text=` y `mailto:` con asunto y cuerpo. Dependen de que el dispositivo tenga WhatsApp o un cliente de correo.\n- Limitación: solo partidos de liga; los playoffs (90 min) no se incluyen; no hay horas porque la app no las guarda.\n\\n## 33. Despliegue y actualización de la versión web (Firebase)\\n\\n- **Dos modos según el dominio.** `BACKEND` vale `\"firebase\"` en GitHub Pages (`*.github.io`) y Netlify (`*.netlify.app`), y `\"claude\"` en claude.ai. En modo Firebase, los datos van a Firestore (`FB_CFG`, SDK compat 10.12.2 desde gstatic) y el acceso es con Google (`fbBoot`, `fbLogin`).\\n- **Administradores.** Documento `config/admins` con el campo `uids` (array de UID de Firebase). Solo ahí se decide quién es administrador. Los administradores de respaldo de la liga (`COMP.admins`) también cuentan.\\n- **Procedimiento de publicación.**\\n  1. Descargar el `index.html` desde claude.ai (el artefacto ya publicado).\\n  2. Subir el archivo como `index.html` a la rama `main` del repositorio (manual con «Add file > Upload files», o con Termux y el script `actualizar.sh`, que busca el último `index*` en Descargas y comprueba que contiene `fbBoot`).\\n  3. Netlify o GitHub Pages publican la nueva versión en uno o dos minutos. Para evitar la caché, abrir la URL con `?v=N`.\\n- **Copia de seguridad.** Inicio > Liga > Datos > Copia de seguridad descarga un JSON `{app:\"p4x\",v:1,liga,nombre,fecha,cols}` con las colecciones de `BKC`. En modo Firebase se descarga directamente desde el navegador (`bkDoWeb`). La restauración (`bkRestore`) escribe con `set`, no borra, y omite `members` y `config/admins`.\\n- **Importar datos.** Para llevar la liga de claude.ai a Firebase: descargar la copia desde claude.ai, iniciar sesión en la versión web y restaurarla desde «Importar datos» (visible también cuando la liga aún no tiene equipos).\\n- **Pendiente.** Las reglas de Firestore son provisionales: solo exigen sesión iniciada. Hay que afinarlas por colección y por rol. Los vínculos cuenta-jugador (`members`) no se migran: cada persona se vincula con su cuenta en «¿Quién eres?».\\n",DOC_BL="# Pádel 4 Xuklis — Backlog funcional\n\n> Se actualiza en cada publicación junto con el resumen técnico.\n\n- **Versión de la aplicación:** 10/11/2026 20:49\n- **Resumen:** 56 historias hechas, 20 pendientes o parciales, 2 descartadas u ocultas.\n- **Última entrega:** US-071 (cerrada: historial de torneos), US-079, US-062, US-090, US-086 (parcial), US-088, US-083, US-082, US-084, US-085, US-081, US-080, US-063 (parcial), US-078 (parcial), US-065, US-076, US-067, US-073, US-075, US-066 y Fase 3.\n- **Prioridad Alta:** no queda ninguna historia pendiente.\n\n## Pendientes y parciales\n\n| ID | Historia | Prioridad | Estado | Notas |\n|---|---|---|---|---|\n| US-024 | Aviso al reducir jornadas con datos | Media | Pendiente | Mostrar qué partidos bloquean la reducción y permitir borrarlos. |\n| US-025 | Registro de cambios (quién, qué, cuándo) | Media | Pendiente | Resultados, partidos y pagos. |\n| US-026 | Comentarios e historial en disputas de resultados | Media | Pendiente |  |\n| US-027 | Modo de pruebas con datos de ejemplo | Media | Pendiente | Parcialmente cubierto por clonar liga (US-058). |\n| US-028 | Migración a backend propio con login real | A valorar | Pendiente | Reglas de acceso por rol en servidor, avisos por correo. |\n| US-029 | Histórico de temporadas | A valorar | Parcial | Archivar y clonar ligas (US-058) cubre parte; falta comparar temporadas. |\n| US-030 | Vista pública de solo lectura | A valorar | Pendiente | Enlace con la clasificación pública. |\n| US-063 | Puntuación tipo Elo y fiabilidad del nivel | Media | Parcial | Hecho: puntuación Elo y fiabilidad del nivel en la ficha de cada equipo. Falta usarla en los algoritmos de emparejamiento (US-079). |\n| US-064 | Nivel como desempate en playoffs | Baja | Pendiente |  |\n| US-068 | Exportaciones Excel con formato numérico y separadores | Baja | Pendiente |  |\n| US-069 | Opción para ocultar los niveles a los jugadores | Baja | Pendiente | Hoy el nivel lo ve todo el mundo. |\n| US-072 | Terminología y reglas por deporte (sets, juegos, puntos) | Media | Pendiente | Hoy el marcador sigue las reglas del pádel. |\n| US-074 | Cuotas con impuestos y cobro online para competiciones con ánimo de lucro | Baja | Pendiente | IVA, facturas y pasarela de pago (requiere backend, ver US-028). |\n| US-077 | Eliminatorio con consolación y formato de grupos más eliminatoria | Baja | Pendiente | Ampliación de US-071. |\n| US-078 | Americano: parejas equilibradas por nivel y ranking histórico | Media | Parcial | Hecho: si los nombres del americano coinciden con jugadores de la liga, el reparto minimiza la diferencia de nivel entre las dos parejas (coste ×5). Falta el ranking histórico entre torneos. |\n| US-086 | Pagos en varios plazos, devoluciones y conciliación con la plataforma de pago | Baja | Parcial | Hecho: pagos parciales (se registra el importe y se muestra lo que falta). Falta: varios plazos con fecha cada uno, devoluciones y conciliación con la plataforma de pago. |\n| US-087 | Jornadas con fechas concretas también en la liga regular | Media | Pendiente | Calendario, disponibilidad y pistas por fecha en lugar de por día de la semana. |\n| US-089 | Playoffs con más de 4 equipos (cuartos de final) y ligas con 3 grupos | Baja | Pendiente | El cuadro actual es de 4 equipos, por eso solo se admiten 1, 2 o 4 grupos. |\n| US-091 | Aviso de pago desde el jugador y validación por el administrador | Media | Pendiente | El jugador indicaría que ha pagado y con qué método; requiere permisos de escritura para jugadores (ver US-028). |\n| US-092 | Los resultados de los torneos alimentan el nivel o la puntuación Elo de los jugadores | Baja | Pendiente | Hoy el torneo es independiente de la liga regular. |\n\n## Hechas\n\n| ID | Historia | Prioridad | Estado | Notas |\n|---|---|---|---|---|\n| US-001…015 | Historias iniciales de la aplicación | — | Hecha | Anteriores a esta documentación; no están detalladas aquí. |\n| US-016 | Detalle de equipo desde la clasificación | — | Hecha | Pulsar un equipo abre su ficha. |\n| US-017 | Pantalla de inicio con resumen (dashboard) | — | Hecha | Tarjetas de métricas, progreso y top; hoy solo resumen (ver US-050). |\n| US-018 | Corrección de asignación y edición de disponibilidad | — | Hecha | Identificadores únicos y persistencia al modificar. |\n| US-019 | Reorganizar el menú principal | — | Hecha | Reordenado después en US-042. |\n| US-020 | Número de jornadas de la liga configurable | — | Hecha | 1 a 52, por defecto 12; no se reduce por debajo de la última jornada con partidos. |\n| US-021 | Gestión de vínculos jugador-cuenta | — | Hecha | Cuentas vinculadas en Inicio > Liga > Cuentas: ver, desvincular y reasignar a otro jugador. |\n| US-022 | Confirmación del administrador al vincular un capitán | — | Hecha | Al elegir su nombre, un capitán queda pendiente (members/<uid>.pend) hasta que el administrador lo aprueba. |\n| US-023 | Copia de seguridad completa con restauración | — | Hecha | Inicio > Liga > Copia de seguridad: descarga JSON de la liga activa y restauración (sobrescribe por id, no borra). |\n| US-031 | Backlog y documentación descargables por el administrador | — | Hecha | Backlog en PDF y Excel; resumen técnico y backlog en MD dentro de la app (US-059). |\n| US-032 | Nombre «Pádel 4 Xuklis» y logo de AFANOC enlazado a afanoc.org | — | Hecha |  |\n| US-033 | Submenús (subopciones) en cad  US-066 | Liga archivada en solo lectura | — | Hecha | Las escrituras de datos de una liga archivada se rechazan en makeDb/wrapRef; siguen permitidos los vínculos de cuentas y reactivarla. |\n| US-067 | Borrado definitivo de ligas con confirmación | — | Hecha | Inicio > ligas > Eliminar liga definitivamente (solo archivadas, no la principal; hay que escribir el nombre). Borra las colecciones de la copia de seguridad. |\n| US-070 | Perfil de competición: tipo (solidaria o con ánimo de lucro), deporte, entidad y causa | — | Hecha | Inicio > Liga > Competición (config/comp). Cambia el texto «Beneficio» por «Beneficio solidario». |\n| US-071 | Formatos de competición: liga, torneo eliminatorio, americano | — | Hecha | Torneos de un día: americano y eliminatorio, rellenables con la liga, con jornadas por fechas, visibles para todos, y con historial: el administrador archiva el torneo terminado (ganador o campeón) y puede crear otro. Los resultados del torneo no alimentan la clasificación de la liga (US-092). |\n| US-073 | Informe de recaudación por causa solidaria | — | Hecha | Inicio > Liga > Competición > Descargar informe (.md): totales de cuotas y beneficio solidario, con entidad y causa. Falta el desglose por causa si hay varias. |\n| US-075 | Reactivar ligas archivadas desde el aviso y la lista | — | Hecha | Botón «Reactivar» en el aviso de liga archivada y en cada liga archivada de la lista (solo administrador); sigue en el selector (US-058). |\n| US-076 | Ver el torneo desde la vista de jugadores y capitanes | — | Hecha | Los jugadores y capitanes ven el torneo en Inicio (solo lectura); el administrador lo edita en Inicio > Liga > Torneo. |\n| US-079 | Algoritmo de emparejamiento por Elo | — | Hecha | Cuarto algoritmo de la liga («Elo»): equivale a «Solo nivel» con el nivel convertido desde la puntuación Elo. Las jornadas 1 y 2 siguen siendo por nivel. |\n| US-080 | Las jornadas 1 y 2 se planifican siempre por nivel | — | Hecha | En gen(), si la jornada es 1 o 2 el algoritmo efectivo es «nivel» aunque la liga use clasificación o mixto. Las explicaciones de los partidos lo indican. No cambia partidos ya planificados. |\n| US-081 | Repartir los rivales: preferir a quien menos se ha enfrentado | — | Hecha | gen() ordena los rivales por enfrentamientos previos (×2) más un punto si no son cercanos; la optimización de US-062 penaliza ×100 cada enfrentamiento previo. Sin probar con los datos reales de 16 equipos. |\n| US-082 | Jornada configurable: semana completa o días fijos de cada semana | — | Hecha | Inicio > Liga > Qué es una jornada. En «días fijos» solo se programan partidos en los días marcados de cada semana (cap(d)=0 en el resto). |\n| US-083 | Jornadas con fechas concretas en los torneos | — | Hecha | Torneo de un día: cada jornada tiene una o varias fechas (por ejemplo sábado y domingo) y cada ronda se asigna a una jornada. Visible para todos. |\n| US-084 | Métodos de pago con enlace a la plataforma de pago | — | Hecha | Inicio > Liga > Métodos de pago (hasta 6, enlace https opcional). Los jugadores los ven en Inicio. |\n| US-085 | Control de pagos: fecha, importe y método por jugador | — | Hecha | Finanzas > Detalles de cada jugador. El importe cobrado cuenta en las finanzas en lugar de la cuota esperada. |\n| US-088 | Grupos en la liga regular; a los playoffs pasan los mejores de cada grupo (por defecto, un único grupo) | — | Hecha | Inicio > Liga > Grupos de la liga: 1, 2 o 4 grupos. Cada equipo solo juega contra su grupo, la clasificación sale por grupo y a las semifinales pasan 2 por grupo (2 grupos) o el primero de cada grupo (4 grupos). |\n| US-090 | Métodos de pago: instrucciones, desglose por método y método por defecto | — | Hecha | Instrucciones por método visibles para los jugadores, «Cobrado por método» en Inicio > Liga y en el informe, y método asignado solo cuando hay uno único. |\n| US-132 | Fechas de inicio y fin de la liga en el Dashboard | — | Hecha | Fin = viernes de la última jornada (no incluye playoffs). |\n| US-133 | Aplazar partidos a otra fecha con motivo e historial | — | Hecha | Solo administrador, partidos sin resultado. Historial en la ficha del partido. |\n| US-134 | Resumen de pistas para el club por WhatsApp o correo | — | Hecha | Solo administrador, en Calendario > Pistas. Enlaces wa.me y mailto. |\n| US-135 | Revisión de la liga en el Dashboard | — | Hecha | Tarjeta de avisos solo para el administrador, en el Dashboard. |\n\n## Descartadas u ocultas\n\n| ID | Historia | Prioridad | Estado | Notas |\n|---|---|---|---|---|\n| US-060 | Colores para el nivel | — | Descartada | Implementada y retirada a petición. |\n| US-061 | Nivel aleatorio de los jugadores | — | Oculta | Botón oculto con SHOW_RND=false en el código. |\n\n## Convenciones\n\n- **Prioridad:** Alta, Media, Baja o A valorar; «—» en las ya hechas.\n- **Estado:** Hecha, Pendiente, Parcial, Descartada u Oculta.\n- Las historias US-001 a US-015 son anteriores a esta documentación y no están detalladas.\n- Cada petición nueva se añade como historia con el siguiente número libre (US-093 en adelante).\n- Terminología: se habla de «jornadas»; las claves técnicas de datos y del asistente (`semana`) no cambian.\n\n";
